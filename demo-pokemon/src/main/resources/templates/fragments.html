<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- =========================================================
     MENÚ DE NAVEGACIÓN
     ========================================================= -->
<nav th:fragment="menu" style="
        background-color: #263238;
        padding: 14px 30px;
        display: flex;
        align-items: center;
        gap: 28px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.15);
     ">

    <a th:href="@{/}"
       style="
          color: white;
          text-decoration: none;
          font-weight: bold;
          font-size: 16px;
       ">
        Inicio
    </a>

    <a th:href="@{/informacion}"
       style="
          color: white;
          text-decoration: none;
          font-weight: bold;
          font-size: 16px;
       ">
        Información
    </a>

    <a th:href="@{/pokemon/tabla}"
       style="
          color: white;
          text-decoration: none;
          font-weight: bold;
          font-size: 16px;
       ">
        Lista
    </a>

    <a th:href="@{/pokemon/galeria}"
       style="
          color: white;
          text-decoration: none;
          font-weight: bold;
          font-size: 16px;
       ">
        Galería
    </a>

    <a th:href="@{/pokemon/batalla}"
       style="
          color: white;
          text-decoration: none;
          font-weight: bold;
          font-size: 16px;
       ">
        Batalla
    </a>

</nav>

<div th:fragment="formulario-busqueda">
    <form th:action="${esTabla} ? @{/pokemon/tabla} : @{/pokemon/galeria}" method="get">
        <label>Tipo: </label>
        <select name="tipo" id="tipo">
            <option value="">Aleatorio</option>
            <option th:each="t : ${tipos}"
                    th:value="${t.name}"
                    th:text="${t.name}"
                    th:selected="${t.name == tipoSeleccionado}">
            </option>
        </select>

        <label>Nombre:
            <input type="text" name="nombre" th:value="${nombre}">
        </label>
        <label>Altura Mínima:
            <input type="number" step="0.1" name="alturaMin" th:value="${alturaMin}">
        </label>
        <label>Peso Máximo:
            <input type="number" step="0.1" name="pesoMax" th:value="${pesoMax}">
        </label>
        <label>Ordenar:
            <select name="orden">
                <option value="">Sin ordenar</option>
                <option value="nombre" th:selected="${orden == 'nombre'}">Nombre</option>
                <option value="altura" th:selected="${orden == 'altura'}">Altura</option>
                <option value="peso" th:selected="${orden == 'peso'}">Peso</option>
            </select>
        </label>
        <label>Sentido:
            <select name="sentido">
                <option value="asc" th:selected="${sentido == 'asc'}">Ascendente</option>
                <option value="desc" th:selected="${sentido == 'desc'}">Descendente</option>
            </select>
        </label>

        <button type="submit">Filtrar</button>
        <a th:href="${esTabla} ? @{/pokemon/tabla} : @{/pokemon/galeria}">Limpiar filtros</a>
    </form>


</div>


<!-- =========================================================
     PIE DE PÁGINA
     ========================================================= -->
<footer th:fragment="footer" style="
            margin-top: 40px;
            padding: 20px;
            background-color: #263238;
            color: white;
            text-align: center;
            font-size: 14px;
        ">

    <p style="margin: 0;">
        Pokédex · Desarrollo Web · 2026
    </p>

</footer>

</body>
</html>
