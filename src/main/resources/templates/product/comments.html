<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

  <head th:replace="~{fragments :: siteHead}"></head>

  <body>

  <header class="site-header">
      <div class="site-header__inner">
          <a class="brand" href="home.html" th:href="@{/}">
              <img src="../static/images/happyPackLogo.png" alt="Happy Pack" th:src="@{/images/happyPackLogo.png}" />
              <span class="brand__text">
            <span class="brand__name">Happy Pack</span>
            <span class="brand__tagline">Regalos útiles para cada ocasión</span>
          </span>
          </a>
          <nav class="main-nav" aria-label="Navegación principal">
              <a href="product/list.html" th:href="@{/product/list}">Productos</a>
          </nav>
      </div>
  </header>

    <main class="page">
      <div class="page-header">
        <p class="eyebrow">Comentarios</p>
        <h1 th:text="${prod.name}">Producto</h1>
        <p class="lead">Opiniones registradas para este producto.</p>
      </div>

      <section class="data-grid" aria-label="Comentarios del producto">
        <article class="grid-row comment-grid" th:each="c : ${prod.comments}">
          <span th:text="${c.text}">Comentario del cliente</span>
        </article>
      </section>

      <nav class="actions">
        <a class="button button--secondary" href="/product/list">Volver a productos</a>
      </nav>
    </main>

  <footer class="site-footer">
      <div class="site-footer__inner">
          <span>&copy; 2026 Happy Pack</span>
      </div>
  </footer>

  </body>

</html>
