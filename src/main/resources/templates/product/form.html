<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

  <head th:replace="~{fragments :: siteHead}"></head>

  <body>

  <header class="site-header">
      <div class="site-header__inner">
          <a class="brand" href="home.html" th:href="@{/}">
              <img src="../static/images/happyPackLogo.png" alt="Happy Pack" th:src="@{/images/happyPackLogo.png}" />
              <span class="brand__text">
            <span class="brand__name">Happy Pack</span>
            <span class="brand__tagline">Regalos útiles para cada ocasión</span>
          </span>
          </a>
          <nav class="main-nav" aria-label="Navegación principal">
              <a href="product/list.html" th:href="@{/product/list}">Productos</a>
          </nav>
      </div>
  </header>

    <main class="page">
      <div class="page-header">
        <p class="eyebrow">Catálogo</p>
        <h1>Nuevo Producto</h1>
        <p class="lead">Añade un nuevo producto al catálogo.</p>
      </div>

      <form class="form-panel" th:action="@{/product/save}" method="post">
        <fieldset>

          <label for="name">Nombre</label>
          <input id="name" type="text" name="name"  required />

          <label for="price">Precio (€)</label>
          <input id="price" type="number" name="price" step="0.01" min="0"  required />

          <label for="inStock">
            <input type="checkbox" id="inStock" name="inStock" />
            En stock
          </label>

          <input type="submit" value="Crear producto" />
        </fieldset>
      </form>

      <nav class="actions">
        <a class="button button--secondary" href="list.html" th:href="@{/product/list}">Cancelar</a>
      </nav>
    </main>

  <footer class="site-footer">
      <div class="site-footer__inner">
          <span>&copy; 2026 Happy Pack</span>
      </div>
  </footer>

  </body>

</html>
