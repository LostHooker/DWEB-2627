<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Happy Pack</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" media="all" href="../static/css/gtvg.css" th:href="@{/css/gtvg.css}" />
    <link rel="icon" type="image/x-icon" href="/images/happyPackLogo.ico"/>
</head>

  <body>

  <header class="site-header">
      <div class="site-header__inner">
          <a class="brand" href="home.html" th:href="@{/}">
              <img src="../static/images/happyPackLogo.png" alt="Happy Pack" th:src="@{/images/happyPackLogo.png}" />
              <span class="brand__text">
            <span class="brand__name">Happy Pack</span>
            <span class="brand__tagline">Regalos útiles para cada ocasión</span>
          </span>
          </a>
          <nav class="main-nav" aria-label="Navegación principal">
              <a href="product/list.html" th:href="@{/product/list}">Productos</a>
          </nav>
      </div>
  </header>

    <main class="page">
      <div class="page-header">
        <p class="eyebrow">Catálogo</p>
        <h1>Productos</h1>
        <p class="lead">Listado de artículos promocionales con precio, disponibilidad y comentarios de clientes.</p>
      </div>

      <section class="data-grid" aria-label="Lista de productos">
        <div class="grid-row grid-row--head product-grid">
            <span>Nombre</span>
          <span class="number">Precio</span>
        </div>

        <article class="grid-row product-grid" th:each="prod : ${prods}">
          <strong th:text="${prod.name}">Bolsa de tela reutilizable</strong>
          <span class="number" th:text="${prod.price + ' €'}">2.50 €</span>
        </article>
      </section>
    </main>

  <footer class="site-footer">
      <div class="site-footer__inner">
          <span>&copy; 2026 Happy Pack</span>
      </div>
  </footer>

  </body>

</html>
